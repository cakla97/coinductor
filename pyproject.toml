[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-trading-agent"
version = "0.1.0"
description = "Periodic local Binance Spot and Simple Earn trading agent MVP."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "truststore>=0.10.4",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
]
build = [
  "pyinstaller>=6.21",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"
coinductor = "coinductor.desktop:main"

[tool.setuptools.packages.find]
include = ["trading_agent*", "coinductor*"]
exclude = ["outputs*", "research*", "state*", "work*", "tests*"]

[tool.setuptools.package-data]
coinductor = ["qml/*.qml", "coinductor.ico", "coinductor.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
