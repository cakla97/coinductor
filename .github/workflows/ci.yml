name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the shipping platform, so the desktop layer is exercised
          # there with PySide6 installed.
          - os: windows-latest
            python-version: "3.12"
            desktop: true
          # Linux without PySide6 keeps the headless engine honest: the Qt tests
          # skip via pytest.importorskip and everything else must still pass.
          - os: ubuntu-latest
            python-version: "3.11"
            desktop: false
          - os: ubuntu-latest
            python-version: "3.12"
            desktop: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install desktop extra
        if: matrix.desktop
        run: python -m pip install -e ".[desktop]"

      - name: Lint
        run: python -m ruff check trading_agent coinductor tests

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
