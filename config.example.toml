[app]
mode = "DRY_RUN"
mock_data = true
base_currency = "USDC"
database_path = "work/trading_agent.sqlite3"
reports_dir = "outputs/reports"
active_strategies_path = "state/active_strategies.toml"

[reports]
keep_last = 30

[retention]
keep_database_runs = 500
keep_research_requests = 30

[research]
enabled = true
notes_dir = "research/notes"
requests_dir = "research/requests"
max_notes = 5
max_chars_per_note = 3000
include_in_ai_commentary = true
generate_requests = true
freshness_hours = 24
request_symbols = ["BTCUSDC", "ETHUSDC", "BNBUSDC"]
request_assets = ["BTC", "ETH", "BNB"]

[market_research]
enabled = true
breadth_quote_asset = "USDC"
min_quote_volume_24h = 1000000.0
max_movers = 5
multi_timeframe_interval = "4h"
kline_limit = 180
excluded_breadth_assets = ["USDC", "USDT", "FDUSD", "TUSD", "DAI", "USD1", "USDE", "EURI", "EUR"]

[binance]
testnet = false
api_base_url = "https://api.binance.com"
testnet_api_base_url = "https://testnet.binance.vision"
recv_window_ms = 5000
timeout_seconds = 30
# Reads are replayed on 429/5xx/dropped connections with exponential backoff.
# Order submissions are never replayed, because a failed POST may already have
# reached the matching engine.
max_retries = 3
retry_backoff_seconds = 1.0
max_retry_wait_seconds = 30.0

[ai]
enabled = false
commentary_enabled = false
provider = "openai_compatible"
base_url_env = "LLM_BASE_URL"
api_key_env = "LLM_API_KEY"
model_env = "LLM_MODEL"
vision_model_env = "LLM_VISION_MODEL"
timeout_seconds = 60
temperature = 0.2

[ai_memory]
enabled = true
max_closed_cycles = 10
min_cycles_for_pattern_inference = 3

[shadow_evaluation]
enabled = true
require_ai_enabled = true
horizon_hours = 24
min_signal_interval_hours = 20
decision_threshold_pct = 0.5

[risk]
max_trades_per_day = 1
max_daily_loss_pct = 1.0
max_weekly_loss_pct = 3.0
max_position_pct_per_asset = 10.0
max_total_trading_capital_pct = 20.0
max_risk_per_trade_pct = 0.25
min_ai_confidence = 0.65
cooldown_after_loss_hours = 24
max_consecutive_losses = 2
kill_switch_enabled = true

[consensus]
enabled = true
require_risk_on = true
require_price_above_ema200 = true
min_rsi14 = 45.0
max_rsi14 = 68.0
require_rising_volume = false

[orders]
require_stop_loss = true
default_stop_loss_pct = 1.5
default_take_profit_pct = 3.0
use_oco_when_live = true

[earn]
allow_flexible_redeem = true
allow_locked_redeem = false
redeem_destination = "SPOT"
allowed_redeem_assets = ["USDC"]
auto_redeem_assets = ["USDC"]
max_redeem_per_run_usdt = 50.0
max_redeem_per_day_usdt = 100.0
max_auto_redeem_usdc_per_run = 12.0
min_flexible_reserve_usdt = 25.0
min_auto_redeem_reserve_usdc = 0.0
wait_for_redeem_seconds = 30
require_redeem_success_before_order = true
execute_real_redeem = false
redeem_type = "FAST"

[strategy]
allowed_symbols = ["BTCUSDC", "ETHUSDC"]
quote_amount_usdt = 25.0
timeframes = ["4h", "1d"]
decision_modes = ["HOLD", "SPOT_TRADE_RECOMMENDATION", "REBALANCE_RECOMMENDATION", "GRID_BOT_RECOMMENDATION"]

[paper]
enabled = true
simulate_spot_trades = true
fee_pct = 0.1
slippage_pct = 0.05
idempotency_window = "daily"

[testnet_execution]
enabled = false
max_quote_amount_usdt = 10.0
allowed_symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT"]

[live_confirm]
enabled = false
preview_only = true
max_quote_amount_usdt = 10.0
funding_buffer_usdt = 1.0
quote_asset = "USDC"

[live_position_guard]
block_new_buy_when_open = true

[trading_bankroll]
enabled = true
quote_asset = "USDC"
initial_seed_usdc = 12.0
prefer_profit_first = true
allow_seed_bootstrap = true
max_flexible_earn_draw_usdc_per_run = 12.0

[portfolio]
# Replace this example universe with your own assets. Keep stablecoins and
# core holdings here; add speculative or legacy assets only if you want the
# agent to see them.
tracked_assets = ["USDC", "USDT", "BTC", "ETH", "BNB"]
pricing_quote_assets = ["USDC", "USDT", "FDUSD"]
ignored_asset_prefixes = ["LD"]

[portfolio.asset_roles]
USDC = "STABLE"
USDT = "STABLE"
BTC = "CORE"
ETH = "CORE"
BNB = "PROTECTED_UTILITY"

[dust_sourcing]
enabled = true
quote_asset = "USDC"
exclude_assets = ["USDC", "USDT", "BTC", "ETH", "BNB"]
max_convert_value_usdt_per_run = 10.0
max_convert_pct_per_asset = 100.0
min_convert_value_usdt_per_asset = 0.5
recommend_only = true

[capital_sourcing]
enabled = true
recommend_only = true
allowed_source_assets = []
protected_assets = ["BTC", "ETH", "BNB"]
max_source_value_usdt_per_run = 20.0
max_source_pct_per_asset = 15.0
max_total_source_pct_per_run = 10.0
min_remaining_value_usdt_per_asset = 50.0
min_remaining_pct_per_asset = 70.0
prefer_overweight_assets = true
require_manual_confirm = true

[grid_bot]
enabled = true
recommend_only = true
allowed_symbols = ["BTCUSDC", "ETHUSDC"]
preferred_symbols = ["BTCUSDC", "ETHUSDC"]
max_active_grid_bots = 1
max_grid_capital_usdt = 50.0
max_grid_capital_pct = 7.5
default_investment_usdt = 25.0
min_range_width_pct = 5.0
max_range_width_pct = 25.0
min_grid_count = 8
max_grid_count = 40
preferred_grid_count = 20
min_quote_per_grid_usdt = 2.5
target_rsi14 = 52.0
min_rsi14 = 40.0
max_rsi14 = 65.0
min_atr_pct = 1.0
max_atr_pct = 6.0
max_abs_ema200_distance_pct = 12.0
max_abs_7d_return_pct = 10.0
suitable_score = 70.0
watch_score = 45.0
atr_range_multiplier = 4.0
stop_loss_buffer_pct = 3.0
take_profit_buffer_pct = 3.0
require_stop_loss = true
require_manual_confirm = true
cancel_if_price_leaves_range_hours = 12
max_runtime_days = 14

[active_strategies]
enabled = true
warn_near_range_pct = 5.0

[rebalancing]
enabled = true
frequency = "weekly"
target_mode = "baseline_current"
threshold_pct = 5.0
drift_threshold_pct = 7.5
min_trade_value_usdt = 5.0
max_trade_value_usdt_per_step = 20.0
max_trade_pct_per_asset = 15.0
min_remaining_pct_per_asset = 70.0
min_remaining_value_usdt_per_asset = 50.0
preview_only = true

[rebalancing.target_allocation]
# Used only when target_mode = "static".
USDC = 50.0
BTC = 30.0
ETH = 15.0
BNB = 5.0

[rebalancing_bot]
enabled = true
# Binance bot creation remains manual. The advisor only proposes guarded parameters.
mode = "THRESHOLD"
allocation_method = "CUSTOM"
auto_rebalance_mode = "BY_RATIO"
# A higher drift threshold limits churn and fees on small bankrolls.
threshold_pct = 10.0
trigger_price_enabled = false
stop_trigger_enabled = false
sell_all_coins_on_stop = false
allowed_assets = ["BTC", "ETH"]
min_assets = 2
min_asset_value_usdt = 25.0
min_investment_usdt = 200.0
max_investment_usdt = 200.0
max_portfolio_pct = 30.0

[rebalancing_bot.funding]
# One-time setup funding. Protected assets are never included; list the
# assets you are willing to sell down to seed the bot, highest priority first.
source_priority = []
full_exit_assets = []
reserve_source_assets = []
max_source_pct_per_reserve_asset = 15.0
min_remaining_value_usdt = 50.0
