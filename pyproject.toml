[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-trading-agent"
# Single source of truth: trading_agent/__init__.py. coinductor re-exports it and
# tests/test_version_is_single_sourced.py holds the Inno Setup script to it.
dynamic = ["version"]
description = "Periodic local Binance Spot and Simple Earn trading agent MVP."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "truststore>=0.10.4",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
  # OS keychain for credentials. SecretStore degrades to .env without it, so
  # this is a desktop extra rather than a core dependency.
  "keyring>=25",
]
build = [
  "pyinstaller>=6.21",
]
dev = [
  "pytest>=8",
  "ruff>=0.13",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"
coinductor = "coinductor.desktop:main"

[tool.setuptools.dynamic]
version = { attr = "trading_agent.__version__" }

[tool.setuptools.packages.find]
include = ["trading_agent*", "coinductor*"]
exclude = ["outputs*", "research*", "state*", "work*", "tests*"]

[tool.setuptools.package-data]
coinductor = ["qml/*.qml", "assets/guides/*", "coinductor.ico", "coinductor.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
  # The codebase deliberately uses long single-line calls and long f-strings.
  "E501",
  # zip(strict=) would turn today's silent truncation into an exception. That is
  # a behaviour change and needs a per-call decision, not a blanket rewrite.
  "B905",
]
